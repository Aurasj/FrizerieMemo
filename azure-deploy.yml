version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: barbershop
      MYSQL_ROOT_PASSWORD: root

  app:
    image: auras0/barbershop-memo:latest
    ports:
      - "80:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/barbershop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db